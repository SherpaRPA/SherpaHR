services:
  app:
    build: .
    network_mode: bridge
    ports:
      - "127.0.0.1:${PORT:-8097}:8080"
    volumes:
      - project_data:/app/var
    healthcheck:
      test: ["CMD", "php", "-r", "exit((json_decode(@file_get_contents('http://127.0.0.1:8080/api/health') ?: '', true)['data']['status'] ?? '') === 'ok' ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  project_data:
